<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Poller — Organizer</title>
<style>
  :root { --accent: #2563eb; --bg: #f8fafc; --line: #e2e8f0; --good: #16a34a; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #0f172a; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .tagline { color: #475569; margin: 0 0 24px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  section h2 { font-size: 1.1rem; margin: 0 0 14px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: 0.9rem; }
  input[type=text], input[type=date], input[type=number], textarea {
    width: 100%; padding: 9px 11px; font-size: 0.95rem; border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; min-height: 110px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  button.primary { margin-top: 14px; padding: 10px 18px; background: var(--accent); color: #fff; border: none;
                   border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
  .linkbox { margin-top: 14px; display: none; }
  .linkbox.show { display: block; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow input { background: var(--bg); font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; }
  .linkrow button { padding: 9px 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px;
                    cursor: pointer; white-space: nowrap; font-weight: 600; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; margin: 3px 4px 0 0; }
  .pill.in { background: #dcfce7; color: #166534; }
  .pill.out { background: #fee2e2; color: #991b1b; }
  .accepted { color: var(--good); font-size: 0.9rem; }
  .rejected { color: var(--bad); font-size: 0.85rem; margin-top: 8px; }
  .rejected div { margin: 2px 0; }
  .controls { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .controls > div { min-width: 120px; }
  .people-toggles { margin-top: 12px; }
  .people-toggles label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
                          margin: 0 14px 8px 0; cursor: pointer; }
  .result { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .result .dates { font-size: 1.05rem; font-weight: 700; }
  .result .score { float: right; font-weight: 700; color: var(--accent); }
  .result .flex { font-size: 0.82rem; color: #475569; margin: 2px 0 8px; }
  .muted { color: #94a3b8; }
  .empty { color: #64748b; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trip Poller</h1>
  <p class="tagline">Find the contiguous N-day block that works for the most people.</p>

  <section>
    <h2>1. Create a trip</h2>
    <div class="row">
      <div>
        <label for="t-name">Trip name</label>
        <input type="text" id="t-name" placeholder="Ski 2026">
      </div>
      <div>
        <label for="t-start">Start date</label>
        <input type="date" id="t-start">
      </div>
      <div>
        <label for="t-days">Window length (days)</label>
        <input type="number" id="t-days" value="90" min="1" max="366">
      </div>
    </div>
    <button class="primary" id="gen">Generate friend link</button>
    <div class="linkbox" id="linkbox">
      <label>Send this link to your friends</label>
      <div class="linkrow">
        <input type="text" id="link" readonly>
        <button id="copylink">Copy</button>
      </div>
    </div>
  </section>

  <section>
    <h2>2. Paste friend codes</h2>
    <label for="codes">Paste codes — commas, spaces, or newlines all work</label>
    <textarea id="codes" placeholder="paste one or many codes here…"></textarea>
    <button class="primary" id="load">Load codes</button>
    <div id="loadstatus"></div>
  </section>

  <section id="analyze-section" style="display:none">
    <h2>3. Best blocks</h2>
    <div class="controls">
      <div>
        <label for="c-n">Block length (N days)</label>
        <input type="number" id="c-n" value="5" min="1">
      </div>
      <div>
        <label for="c-k">Leniency (max days a person may miss)</label>
        <input type="number" id="c-k" value="0" min="0">
      </div>
    </div>
    <div class="people-toggles" id="people"></div>
    <div id="results"></div>
  </section>
</div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TripPoller;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var STORE_KEY = 'tripPoller.codes';

  function fmt(iso) { var p = iso.split('-'); return MONTHS[+p[1]-1] + ' ' + (+p[2]); }
  function el(id) { return document.getElementById(id); }

  // ---------- create trip ----------
  el('gen').addEventListener('click', function () {
    var name = el('t-name').value.trim();
    var start = el('t-start').value;        // YYYY-MM-DD from date input
    var days = parseInt(el('t-days').value, 10);
    if (!name) { alert('Give the trip a name.'); return; }
    if (!start) { alert('Pick a start date.'); return; }
    if (!days || days < 1) { alert('Window length must be at least 1 day.'); return; }
    var token = T.encodeTripToken({ name: name, start: start, days: days });
    var url = new URL('friend.html', location.href); // relative — works on GitHub Pages subpaths
    url.search = '?trip=' + token;
    el('link').value = url.href;
    el('linkbox').classList.add('show');
  });
  el('copylink').addEventListener('click', function () {
    var input = el('link'); if (!input.value) return;
    input.select();
    navigator.clipboard ? navigator.clipboard.writeText(input.value) : document.execCommand('copy');
    var b = this, prev = b.textContent; b.textContent = '✓'; setTimeout(function(){ b.textContent = prev; }, 1200);
  });

  // ---------- load codes ----------
  var state = { trip: null, people: [], excluded: {} };

  function loadFromBlob(blob, persist) {
    var res = T.loadCodes(blob);
    state.trip = res.trip;
    state.people = res.accepted;
    state.excluded = {};
    renderLoadStatus(res);
    if (res.trip && res.accepted.length) {
      el('analyze-section').style.display = '';
      renderPeople();
      recompute();
      if (persist) localStorage.setItem(STORE_KEY, blob);
    } else {
      el('analyze-section').style.display = 'none';
    }
  }

  function renderLoadStatus(res) {
    var s = el('loadstatus');
    s.innerHTML = '';
    if (res.trip) {
      var head = document.createElement('div');
      head.style.marginTop = '10px';
      head.innerHTML = '<strong>' + escapeHtml(res.trip.name) + '</strong> · ' +
        fmt(res.trip.start) + ' – ' + fmt(T.addDays(res.trip.start, res.trip.days - 1));
      s.appendChild(head);
    }
    if (res.accepted.length) {
      var ok = document.createElement('div');
      ok.className = 'accepted';
      ok.textContent = '✓ Loaded ' + res.accepted.length + ': ' +
        res.accepted.map(function (p) { return p.name; }).join(', ');
      s.appendChild(ok);
    }
    if (res.rejected.length) {
      var bad = document.createElement('div');
      bad.className = 'rejected';
      bad.innerHTML = '✗ Rejected ' + res.rejected.length + ':';
      res.rejected.forEach(function (r) {
        var d = document.createElement('div'); d.textContent = '• ' + r.reason; bad.appendChild(d);
      });
      s.appendChild(bad);
    }
    if (!res.accepted.length && !res.rejected.length) {
      s.innerHTML = '<div class="empty" style="margin-top:10px">No codes found in the box.</div>';
    }
  }

  el('load').addEventListener('click', function () {
    loadFromBlob(el('codes').value, true);
  });

  // ---------- analyze controls ----------
  function renderPeople() {
    var box = el('people');
    box.innerHTML = '<label style="font-weight:600;display:block;cursor:default">Include:</label>';
    state.people.forEach(function (p) {
      var lbl = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = true; cb.dataset.name = p.name;
      cb.addEventListener('change', function () {
        state.excluded[p.name] = !cb.checked;
        recompute();
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(p.name));
      box.appendChild(lbl);
    });
  }

  el('c-n').addEventListener('input', recompute);
  el('c-k').addEventListener('input', recompute);

  function recompute() {
    if (!state.trip) return;
    var N = parseInt(el('c-n').value, 10);
    var K = parseInt(el('c-k').value, 10) || 0;
    var excluded = Object.keys(state.excluded).filter(function (n) { return state.excluded[n]; });
    var resultsEl = el('results');

    if (!N || N < 1 || N > state.trip.days) {
      resultsEl.innerHTML = '<p class="empty">Enter a block length between 1 and ' + state.trip.days + '.</p>';
      return;
    }
    var pool = state.people.length - excluded.length;
    var stretches = T.analyze(state.people, state.trip.days, { N: N, K: K, excluded: excluded });
    var ranked = stretches.filter(function (s) { return s.score > 0; }).slice(0, 10);

    if (!ranked.length) {
      resultsEl.innerHTML = '<p class="empty">No ' + N + '-day block has anyone available.</p>';
      return;
    }

    resultsEl.innerHTML = '';
    ranked.forEach(function (s) {
      var firstStart = T.addDays(state.trip.start, s.startD);
      var firstEnd = T.addDays(state.trip.start, s.startD + N - 1);
      var lastDay = T.addDays(state.trip.start, s.endD + N - 1);

      var div = document.createElement('div');
      div.className = 'result';

      var dateLine = fmt(firstStart) + ' – ' + fmt(firstEnd) + ' <span class="muted">(' + N + ' days)</span>';

      div.innerHTML =
        '<div><span class="score">' + s.score + ' of ' + pool + '</span>' +
        '<span class="dates">' + dateLine + '</span></div>';

      if (s.placements > 1) {
        var flex = document.createElement('div');
        flex.className = 'flex';
        flex.textContent = 'Flexible: any ' + N + '-day block between ' + fmt(firstStart) +
          ' and ' + fmt(lastDay) + ' works for the same group (' + s.placements + ' placements).';
        div.appendChild(flex);
      }

      var pills = document.createElement('div');
      s.attendees.forEach(function (n) {
        var p = document.createElement('span'); p.className = 'pill in'; p.textContent = n; pills.appendChild(p);
      });
      s.missing.forEach(function (n) {
        var p = document.createElement('span'); p.className = 'pill out'; p.textContent = 'missing: ' + n;
        pills.appendChild(p);
      });
      div.appendChild(pills);
      resultsEl.appendChild(div);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---------- restore from localStorage ----------
  var saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    el('codes').value = saved;
    loadFromBlob(saved, false);
  }
})();
</script>
</body>
</html>
