<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Poller</title>
<style>
  :root { --accent: #2563eb; --bg: #f8fafc; --line: #e2e8f0; --bad: #dc2626; --good: #16a34a; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #0f172a; line-height: 1.5; min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  .tagline { color: #475569; margin: 0 0 36px; font-size: 1rem; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px;
          display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 1.15rem; margin: 0; }
  .card p { color: #475569; font-size: 0.92rem; margin: 0; }
  .card form { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .card input[type=text] { width: 100%; padding: 10px 12px; font-size: 0.92rem; border: 1px solid var(--line);
                            border-radius: 8px; font-family: ui-monospace, Menlo, monospace; }
  .card button { padding: 11px 18px; background: var(--accent); color: #fff; border: none;
                 border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
  .card button:hover { filter: brightness(1.05); }
  .msg { font-size: 0.85rem; min-height: 1.2em; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trip Poller</h1>
  <p class="tagline">Find the N-day stretch that works for the most people. No accounts, no database.</p>

  <div class="cards">
    <div class="card">
      <h2>Organize a trip</h2>
      <p>Create a window, share a link, collect codes from your friends, and rank the best blocks.</p>
      <div class="spacer"></div>
      <a href="organizer.html"><button type="button" style="width:100%">Start organizing</button></a>
    </div>

    <div class="card">
      <h2>Join a trip</h2>
      <p>Paste the link or trip code your organizer sent you and mark when you’re free.</p>
      <form id="joinForm">
        <input type="text" id="tripInput" placeholder="paste link or trip code…" autocomplete="off">
        <button type="submit">Open trip</button>
      </form>
      <div class="msg" id="joinMsg"></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TripPoller;

  // The paste box accepts either a full URL (friend.html?trip=…&code=…) or
  // a raw trip token. Anything else gets a hard reject — same defensive
  // posture as the bulk-paste box on the organizer.
  function parseTripInput(raw) {
    var s = String(raw || '').trim();
    if (!s) return { ok: false, reason: 'Paste a link or trip code first.' };

    var token = null;
    var code = null;

    // If it looks like a URL (anywhere), pull out ?trip= / ?code= from it.
    // URLSearchParams + a permissive URL constructor handles all the cases
    // (raw query strings, file://, https://) cleanly.
    var qIdx = s.indexOf('?');
    if (qIdx >= 0) {
      try {
        var params = new URLSearchParams(s.slice(qIdx + 1).split('#')[0]);
        if (params.get('trip')) token = params.get('trip');
        if (params.get('code')) code = params.get('code');
      } catch (e) { /* fall through to raw-token path */ }
    }
    // Otherwise assume the user pasted the bare token.
    if (!token) token = s;

    try { T.decodeTripToken(token); }
    catch (e) {
      return { ok: false, reason: "That doesn’t look like a valid trip link or code." };
    }
    return { ok: true, token: token, code: code };
  }

  function showMsg(ok, text) {
    var m = document.getElementById('joinMsg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'bad');
  }

  document.getElementById('joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var res = parseTripInput(document.getElementById('tripInput').value);
    if (!res.ok) { showMsg(false, res.reason); return; }
    var url = 'friend.html?trip=' + encodeURIComponent(res.token);
    if (res.code) url += '&code=' + encodeURIComponent(res.code);
    location.href = url;
  });
})();
</script>
</body>
</html>
