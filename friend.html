<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark your availability</title>
<style>
  :root { --accent: #2563eb; --free: #bfdbfe; --free-border: #2563eb;
          --busy: #fecaca; --busy-border: #dc2626; --bg: #f8fafc; --line: #e2e8f0; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #0f172a; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #475569; margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--line);
                     border-radius: 8px; }
  .helpers { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .helpers button { padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
                    font-size: 0.85rem; cursor: pointer; }
  .helpers button:hover { border-color: var(--accent); color: var(--accent); }
  .month { margin: 18px 0; }
  .month h2 { font-size: 1rem; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 0.7rem; color: #94a3b8; font-weight: 600; padding-bottom: 2px; }
  .day { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
         border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 0.85rem;
         cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
  .day.free { background: var(--free); border-color: var(--free-border); font-weight: 600; }
  .day.busy { background: var(--busy); border-color: var(--busy-border); font-weight: 600;
              color: #991b1b; text-decoration: line-through; }
  .day.blank { border: none; background: transparent; cursor: default; }
  .modes { display: flex; align-items: center; gap: 8px; margin: 16px 0 6px; flex-wrap: wrap; }
  .modes .mlabel { font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { padding: 6px 16px; border: none; background: #fff; cursor: pointer; font-size: 0.85rem; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .seg button.busyon { background: var(--busy-border); color: #fff; font-weight: 600; }
  .mode-caption { font-size: 0.8rem; color: #64748b; margin: 0 0 4px; }
  .codebar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line);
             padding: 12px 16px; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
  .codebar .inner { max-width: 720px; margin: 0 auto; }
  .count { font-size: 0.85rem; color: #475569; margin-bottom: 6px; }
  .coderow { display: flex; gap: 8px; }
  .coderow input { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem;
                   padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .coderow button { padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px;
                    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px; border-radius: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="error" class="error hidden"></div>
  <div id="app" class="hidden">
    <h1 id="title"></h1>
    <p class="sub" id="range"></p>

    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="e.g. Dave" autocomplete="off">

    <div class="modes">
      <span class="mlabel">Mark the days I'm</span>
      <span class="seg">
        <button data-mode="free" class="on">Free</button>
        <button data-mode="busy">Busy</button>
      </span>
    </div>
    <p class="mode-caption" id="modeCaption"></p>

    <div class="helpers">
      <button data-act="all">Select all</button>
      <button data-act="none">Clear all</button>
      <button data-act="weekends">Weekends only</button>
    </div>

    <div id="calendar"></div>
  </div>
</div>

<div id="codebar" class="codebar hidden">
  <div class="inner">
    <div class="count" id="count"></div>
    <div class="coderow">
      <input type="text" id="code" readonly>
      <button id="copy">Copy</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TripPoller;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  function showError(msg) {
    var e = document.getElementById('error');
    e.textContent = msg;
    e.classList.remove('hidden');
  }

  // --- parse trip from URL ---
  var params = new URLSearchParams(location.search);
  var token = params.get('trip');
  var trip;
  if (!token) {
    showError('This link is missing trip info — ask the organizer for the link they generated.');
    return;
  }
  try { trip = T.decodeTripToken(token); }
  catch (err) {
    showError('This trip link looks corrupted — ask the organizer to resend it.');
    return;
  }

  var free = new Array(trip.days).fill(false);
  var mode = 'free'; // 'free' = mark free days; 'busy' = mark busy days, rest free

  function fmt(iso) {
    var p = iso.split('-');
    return MONTHS[+p[1] - 1] + ' ' + (+p[2]);
  }
  function fmtFull(iso) {
    var p = iso.split('-');
    return MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0];
  }

  document.getElementById('app').classList.remove('hidden');
  document.getElementById('codebar').classList.remove('hidden');
  document.getElementById('title').textContent = 'Mark your availability for ' + trip.name;
  document.getElementById('range').textContent =
    fmtFull(trip.start) + ' – ' + fmtFull(T.addDays(trip.start, trip.days - 1));

  // --- build calendar, grouped by month ---
  var calEl = document.getElementById('calendar');
  var cells = {}; // dayIndex -> element

  (function buildCalendar() {
    var i = 0;
    while (i < trip.days) {
      var iso = T.addDays(trip.start, i);
      var parts = iso.split('-').map(Number);
      var year = parts[0], month = parts[1];

      var monthDiv = document.createElement('div');
      monthDiv.className = 'month';
      var h = document.createElement('h2');
      h.textContent = MONTHS[month - 1] + ' ' + year;
      monthDiv.appendChild(h);

      var grid = document.createElement('div');
      grid.className = 'grid';
      DOW.forEach(function (d) {
        var c = document.createElement('div'); c.className = 'dow'; c.textContent = d; grid.appendChild(c);
      });

      // leading blanks for first weekday of this month-run
      var firstDow = new Date(Date.UTC(year, month - 1, parts[2])).getUTCDay();
      for (var b = 0; b < firstDow; b++) {
        var blank = document.createElement('div'); blank.className = 'day blank'; grid.appendChild(blank);
      }

      // days until the month changes or range ends
      while (i < trip.days) {
        var diso = T.addDays(trip.start, i);
        var dp = diso.split('-').map(Number);
        if (dp[1] !== month) break;
        var cell = document.createElement('div');
        cell.className = 'day';
        cell.textContent = dp[2];
        cell.dataset.idx = i;
        cells[i] = cell;
        grid.appendChild(cell);
        i++;
      }
      monthDiv.appendChild(grid);
      calEl.appendChild(monthDiv);
    }
  })();

  function render() {
    for (var k in cells) {
      // In free mode we highlight free days (blue); in busy mode we highlight
      // busy days (red) and leave free days plain. Same `free` array either way.
      cells[k].classList.toggle('free', mode === 'free' && free[k]);
      cells[k].classList.toggle('busy', mode === 'busy' && !free[k]);
    }
    var freeCount = free.filter(Boolean).length;
    var busyCount = free.length - freeCount;
    var msg;
    if (mode === 'free') {
      msg = freeCount + (freeCount === 1 ? ' day' : ' days') + ' free';
    } else {
      msg = busyCount + (busyCount === 1 ? ' day' : ' days') + ' busy · ' +
        freeCount + ' free';
    }
    document.getElementById('count').textContent = msg + ' — send this code to your organizer.';
    updateCode();
  }

  function applyModeUI() {
    var freeBtn = document.querySelector('.seg button[data-mode="free"]');
    var busyBtn = document.querySelector('.seg button[data-mode="busy"]');
    freeBtn.classList.toggle('on', mode === 'free');
    busyBtn.classList.toggle('busyon', mode === 'busy');
    document.getElementById('modeCaption').textContent = mode === 'busy'
      ? 'Paint the days you can’t make it. Everything you don’t mark is treated as free.'
      : 'Paint the days you’re free. Drag across days to select a range.';
  }

  function setMode(next) {
    if (next === mode) return;
    var mixed = free.some(Boolean) && free.some(function (x) { return !x; });
    if (mixed && !window.confirm('Switching will reset your calendar. Continue?')) return;
    mode = next;
    // Smart reset (option a): busy mode starts all-free; free mode starts empty.
    free = free.map(function () { return mode === 'busy'; });
    applyModeUI();
    render();
  }

  function updateCode() {
    var name = document.getElementById('name').value.trim();
    var input = document.getElementById('code');
    if (!name) { input.value = ''; input.placeholder = 'Enter your name to generate your code'; return; }
    input.value = T.encodeFriendCode({ trip: token, name: name, free: free });
  }

  // --- painting interaction (anchor-based range fill; mouse + touch) ---
  // Drag selects the whole date range between where you pressed and where the
  // cursor is now — not just the cells the pointer physically crosses — so a
  // drag from day 7 to day 16 fills every day in between, across week rows.
  var painting = false, paintAnchor = 0, paintVal = true, paintBaseline = null;

  function idxOf(el) {
    if (!el || !el.classList || !el.classList.contains('day') || el.classList.contains('blank')) return null;
    return el.dataset.idx === undefined ? null : +el.dataset.idx;
  }
  function dayUnder(x, y) { return document.elementFromPoint(x, y); }

  function startPaint(idx) {
    painting = true;
    paintAnchor = idx;
    paintVal = !free[idx];        // toggle relative to the anchor cell
    paintBaseline = free.slice(); // snapshot, so each move recomputes cleanly
    dragTo(idx);
  }
  function dragTo(idx) {
    if (!painting || idx === null) return;
    free = T.paintRange(paintBaseline, paintAnchor, idx, paintVal);
    render();
  }
  function endPaint() { painting = false; paintBaseline = null; }

  calEl.addEventListener('mousedown', function (e) {
    var idx = idxOf(e.target.closest ? e.target.closest('.day') : null);
    if (idx === null) return;
    e.preventDefault();
    startPaint(idx);
  });
  calEl.addEventListener('mouseover', function (e) {
    if (!painting) return;
    dragTo(idxOf(e.target.closest ? e.target.closest('.day') : null));
  });
  window.addEventListener('mouseup', endPaint);

  calEl.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    var idx = idxOf(dayUnder(t.clientX, t.clientY));
    if (idx === null) return;
    e.preventDefault();
    startPaint(idx);
  }, { passive: false });
  calEl.addEventListener('touchmove', function (e) {
    if (!painting) return;
    e.preventDefault();
    var t = e.touches[0];
    dragTo(idxOf(dayUnder(t.clientX, t.clientY)));
  }, { passive: false });
  window.addEventListener('touchend', endPaint);

  // --- mode toggle (Free / Busy) ---
  document.querySelector('.seg').addEventListener('click', function (e) {
    var next = e.target.dataset && e.target.dataset.mode;
    if (next) setMode(next);
  });

  // --- quick helpers ---
  document.querySelector('.helpers').addEventListener('click', function (e) {
    var act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    if (act === 'all') free = free.map(function () { return true; });
    else if (act === 'none') free = free.map(function () { return false; });
    else if (act === 'weekends') {
      free = free.map(function (_, i) {
        var dow = new Date(T.addDays(trip.start, i) + 'T00:00:00Z').getUTCDay();
        return dow === 0 || dow === 6;
      });
    }
    render();
  });

  document.getElementById('name').addEventListener('input', updateCode);
  document.getElementById('copy').addEventListener('click', function () {
    var input = document.getElementById('code');
    if (!input.value) return;
    input.select();
    navigator.clipboard ? navigator.clipboard.writeText(input.value) : document.execCommand('copy');
    var btn = this; var prev = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(function () { btn.textContent = prev; }, 1500);
  });

  applyModeUI();
  render();
})();
</script>
</body>
</html>
